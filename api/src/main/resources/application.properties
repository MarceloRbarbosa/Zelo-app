spring.application.name=zelo-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zelo}
spring.datasource.username=${DB_USERNAME:zelo}
spring.datasource.password=${DB_PASSWORD:zelo}

spring.jpa.hibernate.ddl-auto=validate

zelo.security.jwt-secret=${JWT_SECRET}
zelo.security.admin-email=${ADMIN_EMAIL:}
zelo.security.admin-password=${ADMIN_PASSWORD:}
